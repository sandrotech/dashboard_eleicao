server {
    listen 80;
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # Telemetria interna: encaminha pings para o monitor Node
    location /api/ {
        access_log off;
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header User-Agent $http_user_agent;
    }

    # Proxy reverso para API e Fotos do TSE (silencia logs repetitivos a cada 15s)
    location /tse-api/ {
        access_log off;
        proxy_pass https://resultados.tse.jus.br/;
        proxy_ssl_server_name on;
        proxy_set_header Host resultados.tse.jus.br;
        proxy_set_header Referer https://resultados.tse.jus.br/;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64)";
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        add_header Access-Control-Allow-Origin *;
    }

    # Cache estático de assets (silencia logs de imagens e scripts para não poluir o Coolify)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}